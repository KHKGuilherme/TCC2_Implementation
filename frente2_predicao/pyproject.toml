[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defectlens-predicao"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.3",
    "pandas>=2.3,<3",
    "scikit-learn>=1.9",
    "joblib>=1.5",
    "Django>=5.2",
    "djangorestframework>=3.16",
    "gunicorn>=23",
]

[project.optional-dependencies]
teste = ["jsonschema>=4.23"]

[tool.setuptools]
packages = ["predicao", "predicao.medidas"]
