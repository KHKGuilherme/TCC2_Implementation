# GitHub Action opcional: copia os arquivos de deploy da v3 para o Space do Hugging Face.
#
# Para usar:
#   1. Copie este arquivo para .github/workflows/sincronizar_space.yml na raiz do repositório.
#   2. No GitHub, em Settings > Secrets and variables > Actions, crie o segredo HF_TOKEN
#      (token do Hugging Face com permissão de escrita) e as variáveis HF_USUARIO e HF_SPACE.
#   3. A cada push que altere defectlens_v3/ no ramo principal, o Space é atualizado.

name: Sincronizar Space do Hugging Face

on:
  push:
    branches: [main, master]
    paths: ["defectlens_v3/**"]
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Montar a pasta do Space
        run: |
          mkdir space
          cd defectlens_v3
          cp -r Dockerfile iniciar.sh requirements-deploy.txt config.py extrator frente2_predicao modelos ../space/
          mkdir -p ../space/frente3_web
          cp -r frente3_web/backend frente3_web/web ../space/frente3_web/
          cp deploy/README_SPACE.md ../space/README.md
          cp .dockerignore ../space/.dockerignore
          rm -rf ../space/frente3_web/web/node_modules ../space/frente3_web/web/.next
          rm -f ../space/frente3_web/backend/db.sqlite3 ../space/frente3_web/backend/chave_secreta.txt

      - name: Enviar para o Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USUARIO: ${{ vars.HF_USUARIO }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd space
          git init -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Sincroniza com o GitHub (${GITHUB_SHA::7})"
          git push --force "https://${HF_USUARIO}:${HF_TOKEN}@huggingface.co/spaces/${HF_USUARIO}/${HF_SPACE}" main
