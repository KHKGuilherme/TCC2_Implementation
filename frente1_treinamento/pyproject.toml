[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defectlens-treino"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.3",
    "pandas>=2.3,<3",
    "scikit-learn>=1.9",
    "scipy>=1.16",
    "joblib>=1.5",
    "matplotlib>=3.10",
    "jsonschema>=4.23",
]

[tool.setuptools]
packages = ["treino", "treino.medidas"]
